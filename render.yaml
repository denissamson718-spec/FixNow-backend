services:
  - type: web
    name: fixnow-backend
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: npm ci --prefix backend --omit=dev && npm ci --prefix web && npm run build --prefix web
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    numInstances: 1
    disk:
      name: fixnow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data/fixnow
      - key: APP_NAME
        value: FixNow
      - key: ALLOW_RESET_LINK_FALLBACK
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
